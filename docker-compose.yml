# Run:  docker compose up -d --build        Stop: docker compose down
# Secrets come from a server-side .env file (never baked into the image, never sent to the browser).
# Behind a reverse proxy/firewall: publish only 80/443 to the internet; 8501 is bound to localhost here on purpose.
services:
  roadwatch:
    build:
      context: .
      args:
        WITH_INTEGRATIONS: "0"          # set "1" to include the optional SDKs
    image: roadwatch:latest
    restart: unless-stopped             # restart after crashes and reboots
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data:ro                           # built pipeline data (read-only)
      - ./outputs:/app/outputs:ro                     # evaluation outputs (read-only)
      - roadwatch_integrations:/app/outputs/integrations   # writable: caches
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).read()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
volumes:
  roadwatch_integrations:
